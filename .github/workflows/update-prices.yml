name: Update and publish SHPGX prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,7,11 * * *" # 11:00, 15:00, 19:00 China Standard Time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official prices
        run: python collector/jobs/daily_update.py
      - name: Commit updated static data
        run: |
          if ! git diff --quiet -- public/data/updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- public/data/updates.json
            git commit -m "chore: update SHPGX prices"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4