name: Update and publish SHPGX prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,7,11 * * *" # 11:00, 15:00, 19:00 China Standard Time

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official prices
        run: python collector/jobs/daily_update.py
      - name: Validate complete fuel releases
        run: python -m unittest tests.test_fuel_release
      - name: Commit updated static data
        run: |
          if ! git diff --quiet -- public/data/updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- public/data/updates.json
            git commit -m "chore: update SHPGX prices"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build static site
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as wait } from 'node:timers/promises';

          const { GH_TOKEN, PAGES_ARTIFACT_ID, GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID } = process.env;
          if (!/^[0-9]+$/.test(PAGES_ARTIFACT_ID ?? '')) {
            console.error('::error::Pages upload did not return a valid artifact ID.');
            process.exit(1);
          }

          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages`;
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, {
                headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
                signal: AbortSignal.timeout(8000),
              });
              if (response.ok) {
                const { artifacts } = await response.json();
                if (artifacts.some(artifact =>
                  String(artifact.id) === PAGES_ARTIFACT_ID &&
                  artifact.name === 'github-pages' && artifact.expired === false
                )) {
                  console.log(`Pages artifact ${PAGES_ARTIFACT_ID} is visible for run ${GITHUB_RUN_ID}.`);
                  process.exit(0);
                }
              } else {
                console.log(`Artifact listing returned HTTP ${response.status}.`);
              }
            } catch {
              console.log('Artifact listing request failed or timed out.');
            }

            if (attempt < 6) {
              console.log(`Pages artifact not confirmed (attempt ${attempt}/6); retrying in 5 seconds.`);
              await wait(5000);
            }
          }

          console.error(`::error::Could not confirm Pages artifact ${PAGES_ARTIFACT_ID} for run ${GITHUB_RUN_ID}; deployment was not attempted.`);
          process.exit(1);
          NODE
      - id: deployment
        uses: actions/deploy-pages@v4
